; ESP8266 protocol validation target. NOT a supported board.
;
; Proves the portable protocol stack (firmware/protocol + firmware/third_party)
; runs unchanged on a second architecture. Those C files are compiled IN PLACE
; from their existing locations; nothing is copied into this directory.
;
;   pio run -e proto2 -t upload     normal build (PROTOCOL=2)
;   pio run -e proto1 -t upload     reports PROTOCOL=1, for the host refusal check

[platformio]
src_dir = src

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    +<../../protocol/blaze_serial.c>
    +<../../protocol/pico_command.c>
    +<../../third_party/blazebinary/blaze_binary.c>
    +<../../third_party/blazetransport/blaze_transport.c>
build_flags =
    -I../protocol
    -I../third_party/blazebinary
    -I../third_party/blazetransport

[env:proto2]
build_flags = ${env.build_flags} -DBLAZE_PROTOCOL_VERSION=2

[env:proto1]
build_flags = ${env.build_flags} -DBLAZE_PROTOCOL_VERSION=1
