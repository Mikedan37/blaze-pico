name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  host:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Swift host
      working-directory: PicoLEDControlSwift
      run: swift build -c release

    # Hardware chaos tests skip themselves when no Pico is connected
    - name: Test Swift host
      working-directory: PicoLEDControlSwift
      run: swift test
